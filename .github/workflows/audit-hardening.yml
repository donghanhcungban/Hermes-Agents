name: Runtime Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture tracked source for reproducible offline audit
        run: |
          mkdir -p audit-evidence
          git archive --format=zip HEAD -o audit-evidence/source.zip
          git rev-parse HEAD > audit-evidence/revision.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-office.txt 'pytest>=8,<10' 'jsonschema>=4,<5'
      - name: Run all Python tests including function-style tests
        run: python -m pytest tests -q --junitxml=audit-evidence/tests.xml
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit
          path: audit-evidence/
          retention-days: 7
