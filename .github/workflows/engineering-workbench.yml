name: Engineering Workbench

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workbench-office:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-office.txt
      - run: python -m unittest discover -s tests -p 'test_engineering_workbench.py' -v
